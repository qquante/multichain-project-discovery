
services:
  # Message broker for pub/sub
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Stage 0: Tweet Collector (runs every 3 hours)
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: agent-collector
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - COLLECTION_INTERVAL_HOURS=3
      - DB_PATH=/app/data
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Stage 1: Triage (continuous, listens to redis)
  triage:
    build:
      context: .
      dockerfile: services/triage/Dockerfile
    container_name: agent-triage
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_KEY=${OPENROUTER_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      collector:
        condition: service_started
    restart: always

  # Stage 2: Verifier (continuous, listens to redis)
  verifier:
    build:
      context: .
      dockerfile: services/verifier/Dockerfile
    container_name: agent-verifier
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_KEY=${OPENROUTER_KEY:-[REMOVED_CREDENTIAL]}
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      triage:
        condition: service_started
    restart: always

  # Stage 3: Monitor (continuous, listens to redis + internal scheduler)
  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    container_name: agent-monitor
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_KEY=${OPENROUTER_KEY:-[REMOVED_CREDENTIAL]}
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      verifier:
        condition: service_started
    restart: always

  # Abandoned Projects Checker (runs every 7 days)
  abandoned-checker:
    build:
      context: .
      dockerfile: services/abandoned-checker/Dockerfile
    container_name: agent-abandoned-checker
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - CHECK_INTERVAL_DAYS=7
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      monitor:
        condition: service_started
    restart: always

  # Project Discoverer (investigates handles from mentions)
  discoverer:
    build:
      context: .
      dockerfile: services/discoverer/Dockerfile
    container_name: agent-discoverer
    volumes:
      - db-data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_KEY=${OPENROUTER_KEY:-[REMOVED_CREDENTIAL]}
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - DISCOVERY_INTERVAL=1800
      - MIN_MENTIONS=2
      - BATCH_LIMIT=20
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      triage:
        condition: service_started
    restart: always

  # Alpha Hunter (fetches tweets from alpha callers)
  alpha-hunter:
    build:
      context: .
      dockerfile: services/alpha-hunter/Dockerfile
    container_name: agent-alpha-hunter
    volumes:
      - db-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TWITTER_API_KEY=${TWITTER_API_KEY:-[REMOVED_CREDENTIAL]}
      - DB_PATH=/app/data
      - HUNT_INTERVAL_HOURS=${HUNT_INTERVAL_HOURS:-12}
      - ALPHA_CALLERS=${ALPHA_CALLERS:-AresLabs_xyz}
      - TWEETS_PER_CALLER=${TWEETS_PER_CALLER:-20}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # AlphaGate Collector (fetches pre-filtered projects from alphagate.io)
  alphagate:
    build:
      context: .
      dockerfile: services/alphagate/Dockerfile
    container_name: agent-alphagate
    volumes:
      - db-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/data
      - ALPHAGATE_INTERVAL_HOURS=${ALPHAGATE_INTERVAL_HOURS:-2}
      - ALPHAGATE_MAX_FOLLOWERS=${ALPHAGATE_MAX_FOLLOWERS:-50000}
      - ALPHAGATE_MIN_KEY_FOLLOWERS=${ALPHAGATE_MIN_KEY_FOLLOWERS:-1}
      - ALPHAGATE_PAGES=${ALPHAGATE_PAGES:-5}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Telegram Bot 1: Stage 0, 1, Fingerprints (high volume, can be rate limited)
  telegram-low:
    build:
      context: .
      dockerfile: services/telegram-low/Dockerfile
    container_name: agent-telegram-low
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=[REMOVED_CREDENTIAL]
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:--1003466463312}
      - TOPIC_STAGE_0=10
      - TOPIC_STAGE_1=3
      - TOPIC_FINGERPRINTS=12
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Telegram Bot 2: Stage 2, 3, Mentions (critical, never miss)
  telegram-high:
    build:
      context: .
      dockerfile: services/telegram-high/Dockerfile
    container_name: agent-telegram-high
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=[REMOVED_CREDENTIAL]
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:--1003466463312}
      - TOPIC_MENTIONS=14
      - TOPIC_STAGE_2=5
      - TOPIC_STAGE_3=7
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Telegram Chain-Specific Groups (1 bot, 9 groups)
  telegram-chains:
    build:
      context: .
      dockerfile: services/telegram-chains/Dockerfile
    container_name: agent-telegram-chains
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_CHAINS}
      - TELEGRAM_CHAT_ID_SOLANA=${TELEGRAM_CHAT_ID_SOLANA}
      - TELEGRAM_CHAT_ID_BASE=${TELEGRAM_CHAT_ID_BASE}
      - TELEGRAM_CHAT_ID_ETHEREUM=${TELEGRAM_CHAT_ID_ETHEREUM}
      - TELEGRAM_CHAT_ID_BSC=${TELEGRAM_CHAT_ID_BSC}
      - TELEGRAM_CHAT_ID_MEGAETH=${TELEGRAM_CHAT_ID_MEGAETH}
      - TELEGRAM_CHAT_ID_MONAD=${TELEGRAM_CHAT_ID_MONAD}
      - TELEGRAM_CHAT_ID_OTHER=${TELEGRAM_CHAT_ID_OTHER}
      - TELEGRAM_CHAT_ID_UNKNOWN=${TELEGRAM_CHAT_ID_UNKNOWN}
      - TELEGRAM_CHAT_ID_ALL=${TELEGRAM_CHAT_ID_ALL}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # Calendar Alerter (sends launch alerts)
  calendar-alerter:
    build:
      context: .
      dockerfile: services/calendar-alerter/Dockerfile
    container_name: agent-calendar-alerter
    volumes:
      - db-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/app/data
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_CHAINS}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID}
      - ALERT_CHECK_INTERVAL=${ALERT_CHECK_INTERVAL:-60}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ENABLED=${SUPABASE_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

volumes:
  redis-data:
  db-data:

